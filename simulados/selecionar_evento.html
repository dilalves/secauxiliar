<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selecionar evento</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;display:grid;place-items:center;min-height:100vh}.box{width:min(720px,92vw);background:#fff;border-radius:18px;padding:28px;box-shadow:0 12px 40px #0002}h1{margin-top:0}.grid{display:grid;gap:12px}.evt{padding:18px;border:1px solid #dbe3ef;border-radius:14px;cursor:pointer;background:#fff;text-align:left}.evt:hover{border-color:#2563eb;transform:translateY(-1px)}.tag{font-size:12px;font-weight:bold;background:#e8eefc;padding:5px 8px;border-radius:999px}.muted{color:#667085}</style></head><body><main class="box"><h1>Escolha o evento</h1><p class="muted">A unidade continuará no mesmo sistema e poderá trocar de evento quando necessário.</p><div id="lista" class="grid">Carregando...</div></main><script>const API='https://apisec.secauxiliar.com.br/sim_unidades/';async function load(){const box=document.querySelector('#lista');try{const r=await fetch(API+'eventos_disponiveis.php',{credentials:'include'});const j=await r.json();box.innerHTML='';j.eventos.forEach(e=>{const b=document.createElement('button');b.className='evt';b.innerHTML=`<span class="tag">${e.tipo}</span><h3>${e.evento}</h3><div class="muted">${e.dois_dias?'Prova em 2 dias':'Prova em 1 dia'}</div>`;b.onclick=()=>{localStorage.setItem('simulados_evento',e.evento);localStorage.setItem('simulados_tipo',e.tipo);location.href='index.html?evento='+encodeURIComponent(e.evento)};box.appendChild(b)});if(!j.eventos.length)box.textContent='Nenhum evento cadastrado.'}catch(e){box.textContent='Não foi possível carregar os eventos.'}}load();</script></body></html>
