<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Salas - UNIP</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="wwwroot/favicon.png">
</head>
<body>

<div class="login-page">

    <div class="login-card">
        <div class="login-header">
            <img src="wwwroot/unip-logo.png" alt="UNIP" class="login-logo"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="logo-fallback" style="display:none;">UNIP</div>
            <h1 class="login-title">Gestão de Salas</h1>
            <p class="login-subtitle">Acesso restrito à chefia</p>
        </div>

        <form id="login-form" class="login-form" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="usuario">Usuário</label>
                <input 
                    type="text" 
                    id="usuario" 
                    name="usuario" 
                    class="form-input" 
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="senha">Senha</label>
                <div class="senha-wrapper">
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        class="form-input" 
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="btn-visibilidade" id="btn-visibilidade" aria-label="Mostrar senha">👁️</button>
                </div>
            </div>

            <div id="login-erro" class="login-erro" style="display:none;"></div>

            <button type="submit" class="btn-entrar" id="btn-entrar">
                <span class="btn-texto">Entrar</span>
                <span class="btn-spinner" style="display:none;"></span>
            </button>
        </form>

        <div class="login-footer">
            <a href="index.html" class="login-voltar">← Voltar ao Mapa de Salas</a>
        </div>
    </div>

</div>

<script src="login.js"></script>

</body>
</html>
