<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Fundo do andar -->
  <rect width="1000" height="1000" fill="#e8eef7" />

  <!-- Paredes externas -->
  <rect x="30" y="30" width="940" height="940" fill="none" stroke="#1a3a5c" stroke-width="12" rx="4"/>

  <!-- ============================== -->
  <!-- CORREDOR PRINCIPAL HORIZONTAL  -->
  <!-- ============================== -->
  <!-- Corredor ocupa faixa de y=420 a y=580 (160px de largura) no centro -->
  <rect x="30" y="420" width="940" height="160" fill="#c5d6f0" />
  <text x="500" y="510" fill="#075EBD" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" dominant-baseline="middle">CORREDOR PRINCIPAL</text>

  <!-- ============================== -->
  <!-- SALAS SUPERIORES (y=30 a y=420) -->
  <!-- ============================== -->

  <!-- Sala 101 -->
  <rect x="30" y="30" width="220" height="390" fill="#075EBD" stroke="#1a3a5c" stroke-width="3" />
  <text x="140" y="220" fill="#ffffff" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Sala 101</text>
  <!-- Porta (abertura no corredor) -->
  <rect x="100" y="415" width="60" height="10" fill="#c5d6f0" />

  <!-- Sala 102 -->
  <rect x="250" y="30" width="220" height="390" fill="#075EBD" stroke="#1a3a5c" stroke-width="3" />
  <text x="360" y="220" fill="#ffffff" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Sala 102</text>
  <rect x="320" y="415" width="60" height="10" fill="#c5d6f0" />

  <!-- Sala 103 -->
  <rect x="470" y="30" width="220" height="390" fill="#075EBD" stroke="#1a3a5c" stroke-width="3" />
  <text x="580" y="220" fill="#ffffff" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Sala 103</text>
  <rect x="540" y="415" width="60" height="10" fill="#c5d6f0" />

  <!-- Laboratório 205 -->
  <rect x="690" y="30" width="280" height="390" fill="#1a6b3c" stroke="#1a3a5c" stroke-width="3" />
  <text x="830" y="200" fill="#ffffff" font-family="Arial" font-size="26" font-weight="bold" text-anchor="middle">Laboratório</text>
  <text x="830" y="240" fill="#ffffff" font-family="Arial" font-size="26" font-weight="bold" text-anchor="middle">205</text>
  <rect x="780" y="415" width="60" height="10" fill="#c5d6f0" />

  <!-- ============================== -->
  <!-- SALAS INFERIORES (y=580 a y=970) -->
  <!-- ============================== -->

  <!-- Sala 104 -->
  <rect x="30" y="580" width="220" height="390" fill="#075EBD" stroke="#1a3a5c" stroke-width="3" />
  <text x="140" y="780" fill="#ffffff" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Sala 104</text>
  <rect x="100" y="575" width="60" height="10" fill="#c5d6f0" />

  <!-- Sala 105 -->
  <rect x="250" y="580" width="220" height="390" fill="#075EBD" stroke="#1a3a5c" stroke-width="3" />
  <text x="360" y="780" fill="#ffffff" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Sala 105</text>
  <rect x="320" y="575" width="60" height="10" fill="#c5d6f0" />

  <!-- Sala 106 -->
  <rect x="470" y="580" width="220" height="390" fill="#075EBD" stroke="#1a3a5c" stroke-width="3" />
  <text x="580" y="780" fill="#ffffff" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Sala 106</text>
  <rect x="540" y="575" width="60" height="10" fill="#c5d6f0" />

  <!-- ============================== -->
  <!-- ELEVADOR + ESCADA (Direita) -->
  <!-- ============================== -->
  <rect x="690" y="580" width="130" height="390" fill="#FFED00" stroke="#1a3a5c" stroke-width="3" />
  <text x="755" y="760" fill="#075EBD" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">Elevador</text>
  <rect x="700" y="575" width="60" height="10" fill="#c5d6f0" />

  <rect x="840" y="580" width="130" height="390" fill="#f0a500" stroke="#1a3a5c" stroke-width="3" />
  <text x="905" y="760" fill="#ffffff" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">Escada</text>
  <rect x="860" y="575" width="60" height="10" fill="#c5d6f0" />

  <!-- Ícone de localização atual (QRCode) -->
  <circle cx="905" cy="500" r="22" fill="#075EBD" stroke="#FFED00" stroke-width="4"/>
  <text x="905" y="507" fill="#FFED00" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">📍</text>
  <text x="905" y="545" fill="#1a3a5c" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Você está aqui</text>
</svg>
