<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="https://www.curso-objetivo.br/assets/img/favicon.ico">
  <title>SEC-AUXILIAR — Acesso</title>
  <style>
    :root{--primary:#0b3b78;--primary-2:#124f99;--bg:#eef4fb;--card:#fff;--line:#dbe6f3;--ink:#0f172a;--muted:#64748b;--danger:#b42318}
    *{box-sizing:border-box} html,body{height:100%;margin:0}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top right,#d9e9ff 0,transparent 35%),var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px}
    .shell{width:min(960px,100%);display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 24px 70px rgba(11,59,120,.14)}
    .brand{background:linear-gradient(145deg,var(--primary),var(--primary-2));color:#fff;padding:54px;display:flex;flex-direction:column;justify-content:space-between;min-height:560px}
    .brand-mark{display:flex;align-items:center;gap:14px;font-weight:800;font-size:22px}.brand-mark img{height:34px}.brand h1{font-size:42px;line-height:1.05;margin:0 0 16px}.brand p{margin:0;color:#dbeafe;font-size:17px;line-height:1.6}.brand small{color:#bfd5f2}
    .login{padding:54px;display:flex;flex-direction:column;justify-content:center}.login h2{font-size:28px;margin:0 0 8px}.login .sub{color:var(--muted);margin-bottom:30px}
    label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}.field{position:relative}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;outline:none;transition:.15s}.field input:focus{border-color:#7aa7df;box-shadow:0 0 0 4px rgba(37,99,235,.10)}
    button{width:100%;height:48px;margin-top:24px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(11,59,120,.22)}button:hover{filter:brightness(1.06)}button:disabled{opacity:.65;cursor:wait}
    .msg{min-height:22px;margin-top:14px;text-align:center;color:var(--danger);font-size:14px}.foot{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
    @media(max-width:760px){.shell{grid-template-columns:1fr}.brand{display:none}.login{padding:34px 24px;min-height:520px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="brand">
      <div class="brand-mark"><img src="/optativos/logo-mini.png" alt="Objetivo"> SEC-AUXILIAR</div>
      <div><h1>Seu painel de sistemas, agora em um só lugar.</h1><p>Acesso centralizado aos módulos administrativos e operacionais.</p></div>
      <small>3A Sistemas • Curso Objetivo</small>
    </section>
    <section class="login">
      <h2>Bem-vindo</h2><div class="sub">Entre com seu usuário e senha para continuar.</div>
      <form id="formLogin">
        <label for="login">Usuário</label><div class="field"><input id="login" name="login" autocomplete="username" required autofocus></div>
        <label for="senha">Senha</label><div class="field"><input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
        <button id="btn" type="submit">Entrar no sistema</button><div id="msg" class="msg" role="alert"></div>
      </form>
      <div class="foot">SEC-AUXILIAR • Ambiente administrativo</div>
    </section>
  </main>
<script>
const API='https://apisec.secauxiliar.com.br/sec/';
const form=document.getElementById('formLogin'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
form.addEventListener('submit',async(e)=>{e.preventDefault();msg.textContent='';const login=document.getElementById('login').value.trim(),senha=document.getElementById('senha').value;if(!login||!senha){msg.textContent='Informe usuário e senha.';return}btn.disabled=true;btn.textContent='Entrando...';try{const r=await fetch(API+'auth_login.php',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({login,senha})});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||data.msg||'Falha no login.');location.replace('./painel.html')}catch(err){msg.textContent=err.message||'Erro de rede ou servidor indisponível.';btn.disabled=false;btn.textContent='Entrar no sistema'}});
</script>
</body></html>
