<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste OMR — Fuvestão</title>
<style>:root{--a:#0b3b78;--f:#f4f7fb;--l:#dbe5f1}*{box-sizing:border-box}body{margin:0;font:14px Arial;background:var(--f);color:#17324d}.top{background:var(--a);color:#fff;padding:18px 24px;font-size:20px;font-weight:bold}.wrap{padding:20px;max-width:1500px;margin:auto}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:16px;margin-bottom:16px}.bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.g{min-width:230px}label{display:block;font-weight:bold;margin-bottom:5px}select,input{width:100%;padding:9px;border:1px solid #ccd8e6;border-radius:6px}button{border:0;border-radius:7px;padding:11px 16px;font-weight:bold;cursor:pointer;background:var(--a);color:#fff}.grid{display:grid;grid-template-columns:1fr 360px;gap:16px}#viewer{position:relative;display:inline-block;max-width:100%}#preview{display:block;max-width:100%;height:auto}.box{position:absolute;border:2px solid #e11d48;background:#e11d4818;pointer-events:none}.box span{position:absolute;top:-19px;left:-2px;background:#e11d48;color:white;padding:2px 4px;font-size:10px;white-space:nowrap}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;max-height:420px;overflow:auto}.k{padding:9px;border-bottom:1px solid #eee}.k b{display:block;color:#64748b;font-size:12px}.v{font-size:18px;font-weight:bold}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="top">Simulados Abertos — Laboratório OMR</div><div class="wrap"><div class="card"><div class="bar"><div class="g"><label>Projeto</label><select id="projeto"></select></div><div class="g" style="min-width:330px"><label>Folha preenchida</label><input id="arquivo" type="file" accept=".jpg,.jpeg,.png"></div><button id="btn">Processar OMR</button></div><p>Use uma folha real preenchida. A máscara será sobreposta para conferência visual.</p></div><div class="grid"><div class="card" style="overflow:auto"><div id="viewer"><img id="preview" draggable="false"></div></div><div class="card"><h3>Resultado</h3><div class="k"><b>Status</b><span class="v" id="status">Aguardando...</span></div><div class="k"><b>Inscrição</b><span class="v" id="inscricao">—</span></div><div class="k"><b>Versão</b><span class="v" id="versao">—</span></div><div class="k"><b>Questões</b><span class="v" id="qtd">—</span></div><h3>Respostas</h3><pre id="respostas">—</pre><h3>Diagnóstico</h3><pre id="diag">—</pre></div></div></div>
<script>
const AP='https://apisec.secauxiliar.com.br/sim_adm_hml_hml/omr_projetos.php', PROC='https://apisec.secauxiliar.com.br/sim_adm_hml_hml/omr_processar.php';let atual=null;
const $=id=>document.getElementById(id);
async function projetos(){try{let j=await(await fetch(AP+'?acao=listar')).json();$('projeto').innerHTML=(j.projetos||[]).map(p=>`<option value="${p.id}">${p.nome} — ${p.evento||''} (${p.qtd_campos} campos)</option>`).join('');await obter()}catch(e){$('diag').textContent=e.message}}
async function obter(){if(!$('projeto').value)return;let j=await(await fetch(AP+'?acao=obter&id='+$('projeto').value)).json();atual=j.projeto}
function boxes(cs){document.querySelectorAll('.box').forEach(x=>x.remove());(cs||[]).forEach(c=>{let d=document.createElement('div');d.className='box';d.style.cssText=`left:${+c.x*100}%;top:${+c.y*100}%;width:${+c.w*100}%;height:${+c.h*100}%`;d.innerHTML=`<span>${c.nome}</span>`;$('viewer').appendChild(d)})}
$('projeto').onchange=obter;$('arquivo').onchange=()=>{let f=$('arquivo').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').onload=()=>boxes(atual?.campos)}};
$('btn').onclick=async()=>{let f=$('arquivo').files[0];if(!f)return alert('Escolha uma folha preenchida.');$('btn').disabled=true;$('status').textContent='Processando...';try{let fd=new FormData();fd.append('arquivo',f);fd.append('projeto_id',$('projeto').value);let r=await fetch(PROC,{method:'POST',body:fd}),t=await r.text(),j;try{j=JSON.parse(t)}catch(e){throw Error('PHP não devolveu JSON:\n'+t)}$('diag').textContent=JSON.stringify(j.diagnostico||j,null,2);if(!j.ok)throw Error(j.erro||'Erro');$('status').textContent=j.status;$('inscricao').textContent=j.inscricao||'—';$('versao').textContent=j.versao||'—';let a=j.respostas||{};$('qtd').textContent=Object.keys(a).length;$('respostas').textContent=Object.entries(a).map(([q,v])=>String(q).padStart(2,'0')+' = '+(v||'?')).join('\n');boxes(j.campos||atual?.campos)}catch(e){$('status').textContent='ERRO';$('diag').textContent=e.message+'\n'+$('diag').textContent}finally{$('btn').disabled=false}};projetos();
</script></body></html>
