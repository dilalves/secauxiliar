<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pré-Matrículas | SEC-AUXILIAR</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#18314d;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}.top{background:#0752a5;color:white;padding:22px max(20px,calc((100vw - 1100px)/2))}main{max-width:1100px;margin:22px auto;padding:0 18px}.card{background:white;padding:22px;border:1px solid #dbe4ee;border-radius:13px;margin-bottom:18px;box-shadow:0 4px 16px #1232  }h1{font-size:24px;margin:0}h2{font-size:19px;margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #b5c6d8;border-radius:8px;font-size:15px}button{border:0;background:#0752a5;color:white;padding:11px 16px;border-radius:8px;cursor:pointer;font-weight:650}button:disabled{opacity:.5}.secondary{background:#e9f0fa;color:#06478c}.hint{color:#53677d;font-size:13px}.item{display:flex;align-items:center;gap:15px;justify-content:space-between;border-top:1px solid #e6edf5;padding:13px 0;flex-wrap:wrap}.message{padding:12px;border-radius:8px;background:#eff6ff;margin:10px 0;white-space:pre-wrap}.error{background:#feecec;color:#922}.hide{display:none}#linkbox{overflow-wrap:anywhere}a{color:#0752a5}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{padding:20px}}</style></head>
<body><header class="top"><h1>Pré-Matrícula Digital</h1><div>SEC-AUXILIAR · Atendimento da unidade</div></header><main><section class="card"><h2>Nova solicitação</h2><p class="hint">Primeira versão: busca por CPF nas pré-matrículas deste módulo. A integração com a base existente será adicionada após validar a consulta de alunos.</p><form id="form"><div class="grid"><div><label>CPF do aluno</label><input name="cpf" required placeholder="000.000.000-00"><button type="button" class="secondary" id="find" style="margin-top:8px">Consultar CPF</button></div><div><label>Nome completo do aluno</label><input name="name" required maxlength="150"></div><div><label>Nascimento (se disponível)</label><input name="birth" type="date"></div><div><label>Nome da unidade (usado apenas se ausente na sessão)</label><input name="unit_name" placeholder="Ex.: Paulista"></div><div><label>Curso</label><select name="course" required><option value="Extensivo">Extensivo</option><option value="Intensivo">Intensivo</option></select></div><div><label>Ano letivo</label><input name="year" type="number" value="2027" min="2026" max="2100" required></div><div><label>Período</label><select name="period" required><option>Manhã</option><option>Tarde</option><option>Vespertino</option><option>Noite</option></select></div><div><label>Número de parcelas</label><input name="installments" type="number" min="1" max="36" value="13" required></div><div><label>Valor por parcela (R$)</label><input name="value" type="number" min="0.01" step="0.01" value="800.00" required></div><div><label>E-mail para envio</label><input name="email" type="email" required></div></div><p><button type="submit">Criar solicitação</button></p></form><div id="feedback" class="message hide" role="status"></div><div id="linkbox" class="message hide"></div></section><section class="card"><h2>Solicitações da unidade</h2><p><button type="button" class="secondary" id="refresh">Atualizar lista</button></p><div id="list" class="hint">Carregando...</div></section></main><script>
const API='https://apisec.secauxiliar.com.br/sec/pm_staff.php';const $=id=>document.getElementById(id);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(action,params,method='GET'){const r=await fetch(API+'?action='+encodeURIComponent(action)+(method==='GET'?'&'+new URLSearchParams(params):''),{method,credentials:'include',headers:{'Accept':'application/json',...(method==='POST'?{'Content-Type':'application/json'}:{})},body:method==='POST'?JSON.stringify(params):undefined});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||'Falha na operacao');return x;}
function feedback(t,error=false){$('feedback').className='message'+(error?' error':'');$('feedback').textContent=t;}
async function refresh(){try{const x=await req('list',{});$('list').replaceChildren();if(!x.items.length){$('list').textContent='Nenhuma solicitacao nesta unidade.';return}for(const a of x.items){const el=document.createElement('div');el.className='item';const d=document.createElement('div');d.textContent=[a.Protocolo,a.Aluno,a.Curso,a.Periodo,a.Status].filter(Boolean).join(' · ');const b=document.createElement('button');b.textContent='Gerar / renovar link';b.className='secondary';b.onclick=()=>issue(a.IdPreMatricula,a.Protocolo);el.append(d,b);$('list').append(el)}}catch(e){$('list').textContent=e.message}}
async function issue(id,proto){if(!confirm('Gerar novo link para '+proto+'? Links anteriores serao revogados.'))return;try{const x=await req('issue',{id},'POST');$('linkbox').className='message';$('linkbox').replaceChildren();const p=document.createElement('p');p.textContent=x.message;const a=document.createElement('a');a.href=x.url;a.textContent=x.url;a.target='_blank';a.rel='noopener noreferrer';$('linkbox').append(p,a);await refresh()}catch(e){feedback(e.message,true)}}
$('find').onclick=async()=>{try{const x=await req('find',{cpf:$('form').elements.cpf.value});if(x.previous){$('form').elements.name.value=x.previous.Nome; if(x.previous.DataNascimento)$('form').elements.birth.value=x.previous.DataNascimento;feedback('Registro anterior: '+x.previous.Protocolo+' · '+x.previous.Status)}else feedback('Nao ha pre-matricula anterior neste modulo. Informe os dados do aluno.')}catch(e){feedback(e.message,true)}};
$('form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const x=Object.fromEntries(new FormData(f).entries());try{const y=await req('create',x,'POST');feedback('Solicitacao criada: '+y.protocolo+'. Gere o link na lista abaixo.');await refresh()}catch(e){feedback(e.message,true)}};$('refresh').onclick=refresh;refresh();
</script></body></html>
