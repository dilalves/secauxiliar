<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de presença — Concurso de Bolsa</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eff6;color:#162d45;font:12px Arial,sans-serif}.bar{position:sticky;top:0;z-index:10;background:#143f7d;color:#fff;padding:11px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.bar button{padding:9px 15px;border:0;border-radius:5px;background:#fff;color:#174476;font-weight:bold;cursor:pointer}.bar h1{font-size:16px;margin:0}.bar small{display:block;margin-top:4px;color:#deebfa}.error{color:#9c2222;background:#ffefef;margin:20px auto;padding:15px;max-width:900px;border-radius:5px}.sheets{padding:18px 10px}.paper{background:#fff;width:210mm;min-height:297mm;margin:0 auto 16px;padding:13mm 12mm 12mm;box-shadow:0 4px 16px #1e405d26;display:flex;flex-direction:column;break-after:page;page-break-after:always}.paper:last-child{break-after:auto;page-break-after:auto}.paper-head{border-bottom:2px solid #1e568e;padding-bottom:7mm;margin-bottom:5mm;display:flex;gap:16px;justify-content:space-between;align-items:flex-start}.logo{flex:0 0 72mm;max-width:72mm;display:flex;align-items:center}.logo img{display:block;width:100%;height:auto;max-height:25mm;object-fit:contain;object-position:left center}.info{text-align:right;line-height:1.7}.info strong{font-size:15px;color:#092b50}.meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 15px;margin-bottom:4mm;font-size:11px}.meta b{color:#124d8d}.report{border-collapse:collapse;width:100%;table-layout:fixed;font-size:10px}.report th{padding:7px 6px;text-align:left;background:#dcecf1;border-bottom:1.5px solid #2e647b}.report td{height:7mm;padding:4px 6px;border-bottom:1px solid #899aa9;vertical-align:middle}.report tr:nth-child(even) td{background:#edf7fa}.report td:nth-child(1),.report td:nth-child(2){white-space:nowrap}.report .n{width:6%}.report .num{width:16%}.report .nome{width:37%}.report .cel{width:17%}.report .ass{width:24%}.footer{margin-top:auto;border-top:1px solid #aab9c6;padding-top:7px;display:flex;justify-content:space-between;font-size:10px;color:#3e617e}.empty{margin-top:20mm;text-align:center;color:#7a8996}.loading{padding:35px;text-align:center}.hide{display:none}
@page{size:A4 portrait;margin:0} @media print{html,body{width:210mm;background:#fff!important}.bar,.error,.loading{display:none!important}.sheets{padding:0}.paper{margin:0;box-shadow:none;width:210mm;min-height:297mm;height:297mm;overflow:hidden}.paper:last-child{break-after:auto}}@media screen and (max-width:850px){.paper{transform-origin:top left;max-width:100%;width:210mm}.sheets{overflow-x:auto}}
</style>
</head><body>
<div class="bar"><div><h1>Lista de presença — Concurso de Bolsa</h1><small id="status">Carregando informações...</small></div><button id="print" type="button" disabled>Imprimir lista</button></div>
<div id="error" class="error hide" role="alert"></div><div id="loading" class="loading">Preparando relatório...</div><div id="sheets" class="sheets"></div>
<script>
'use strict';
const API='https://apisec.secauxiliar.com.br/sec/consultar_concursos_unidade.php';
const params=new URLSearchParams(location.search),id=params.get('IdConcurso')||'';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateBR(v){const d=String(v||'').slice(0,10).split('-');return d.length===3?`${d[2]}/${d[1]}/${d[0]}`:'—';}
function phone(v){const d=String(v??'').replace(/\D/g,'');if(d.length===11)return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return String(v||'').trim()||'(     )';}
function reportPage(data,list,page,total,start){const c=data.concurso,u=data.unidade;return `<article class="paper"><div class="paper-head"><div class="logo"><img src="objetivo_logo.png" alt="Curso Objetivo"></div><div class="info"><strong>LISTA DE PRESENÇA</strong><div>Concurso ${esc(c.IdConcurso)} — ${esc(String(c.Descricao||'').toLocaleUpperCase('pt-BR'))}</div></div></div><div class="meta"><div><b>Unidade:</b> ${esc(String(u.nome||'').toLocaleUpperCase('pt-BR'))} (${esc(u.idund)})</div><div><b>Data:</b> ${dateBR(c.Data)} · <b>Hora:</b> ${esc(c.Hora||'—')}h</div><div><b>Prova:</b> ${esc(c.CodProva||'—')}</div><div><b>Faixa:</b> ${esc(c.Faixa||'—')}</div></div><table class="report"><thead><tr><th class="n">Nº</th><th class="num">INSCRIÇÃO</th><th class="nome">NOME</th><th class="cel">CELULAR</th><th class="ass">ASSINATURA</th></tr></thead><tbody>${list.map((x,i)=>`<tr><td>${start+i+1}</td><td>${esc(x.NumeroInscricao||'—')}</td><td>${esc(String(x.NomeCand||'').toLocaleUpperCase('pt-BR'))}</td><td>${esc(phone(x.TelefoneCelular))}</td><td></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">Nenhum inscrito encontrado.</div>'}<div class="footer"><div>Unidade: ${esc(String(u.nome||'').toLocaleUpperCase('pt-BR'))} · Total de inscritos: ${data.inscritos.length}</div><div>Página ${page}/${total}</div></div></article>`;}
async function load(){try{if(!/^[A-Za-z0-9_-]{1,50}$/.test(id))throw Error('Código do concurso inválido.');const r=await fetch(API+'?IdConcurso='+encodeURIComponent(id),{credentials:'include',cache:'no-store'});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||data.msg||'Não foi possível obter os inscritos.');const inscritos=(data.inscritos||[]).slice().sort((a,b)=>String(a.NomeCand||'').localeCompare(String(b.NomeCand||''),'pt-BR'));data.inscritos=inscritos;const porPagina=34,total=Math.max(1,Math.ceil(inscritos.length/porPagina));let html='';for(let i=0;i<total;i++)html+=reportPage(data,inscritos.slice(i*porPagina,(i+1)*porPagina),i+1,total,i*porPagina);$('sheets').innerHTML=html;$('status').textContent=`${data.concurso.IdConcurso} · ${data.unidade.nome} · ${inscritos.length} inscrito(s) · ${total} página(s)`;$('print').disabled=false;$('loading').classList.add('hide');if(params.get('imprimir')==='1')setTimeout(()=>window.print(),350);}catch(err){$('loading').classList.add('hide');$('error').textContent=err.message;$('error').classList.remove('hide');}}
$('print').addEventListener('click',()=>window.print());load();
</script></body></html>
