<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEC — Gabaritos</title><style>body{font:14px Arial;color:#193656;background:#f2f6fc;margin:18px}header{background:#103e78;color:white;padding:20px;border-radius:10px}h2{margin:0}section{background:white;padding:16px;margin-top:12px;border:1px solid #dce6f2;border-radius:9px}button{background:#103e78;color:white;border:0;border-radius:6px;padding:10px;cursor:pointer}button:disabled{opacity:.5;cursor:default}input,select{padding:8px;border:1px solid #b9cce1;border-radius:4px}label{display:inline-block;margin:6px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #dce6f2}#grid{display:grid;grid-template-rows:repeat(15,auto);grid-auto-flow:column;gap:4px 12px}#grid label{display:flex;align-items:center;justify-content:space-between;margin:0}#grid input{width:30px;text-align:center;font-weight:bold;padding:5px}#grid input:disabled{background:#eee}#work{display:flex;gap:15px;flex-wrap:wrap}#left{flex:1;min-width:540px}iframe{width:100%;height:620px;border:1px solid #ccc}#right{flex:1;min-width:300px}#msg{white-space:pre-wrap;color:#a22;padding:8px} [hidden]{display:none!important}</style><header><h2>Cadastro de Gabaritos — Simulados</h2><p>Importação e conferência de respostas oficiais</p></header><section><label>Ano <input id="ano" type="number" value="2027" min="2020" max="2100"></label><button id="load">Atualizar</button><label>Localizar <input id="search" placeholder="Código ou descrição"></label><div id="msg" role="status"></div><table><thead><tr><th>Data</th><th>Código</th><th>Prova</th><th>Gabarito</th><th></th></tr></thead><tbody id="rows"></tbody></table></section><section id="editor" hidden><h3 id="title"></h3><label>Código TRILHA <input id="trilha" maxlength="50"></label><label>Questões objetivas <input id="total" type="number" min="1" max="90" style="width:65px"></label><p id="state"></p><div id="work"><div id="left"><div id="grid"></div><p>A–E: alternativa correta · #: anulada · vazio: pendente</p><input type="file" id="file" accept="application/pdf"><button id="importar">Importar resolução</button><p><button id="salvar">Salvar rascunho</button> <button id="confirmar">Confirmar gabarito</button> <button id="close">Fechar</button></p></div><div id="right"><iframe id="pdf" title="Resolução PDF" hidden></iframe></div></div></section><script>
'use strict';const $=id=>document.getElementById(id),api='https://apisec.secauxiliar.com.br/sec/simulados_gabaritos_api.php';let list=[],current=null,busy=false;const say=t=>$('msg').textContent=t;function url(action,params={}){const u=new URL(api);u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));return u}async function req(action,params={},body){const r=await fetch(url(action,params),{credentials:'include',cache:'no-store',...(body?{method:'POST',body}:{})});const j=await r.json().catch(()=>null);if(!r.ok||!j?.ok)throw Error(j?.error||j?.message||'Erro HTTP '+r.status);return j}function render(){const t=$('rows');t.replaceChildren();for(const p of list.filter(p=>(p.codigo_oficial+' '+p.descricao+' '+p.evento).toLowerCase().includes($('search').value.toLowerCase()))){const tr=t.insertRow();for(const v of [p.data_aplicacao,p.codigo_oficial,p.descricao,p.gabarito_status||'PENDENTE'])tr.insertCell().textContent=v;const b=document.createElement('button');b.textContent='Abrir';b.onclick=()=>run(()=>open(p.id));tr.insertCell().append(b)}}async function load(){list=(await req('lista',{ano:$('ano').value})).provas;render()}function enable(){const n=Number($('total').value),locked=current?.gabarito?.Status==='CONFIRMADO';for(let i=1;i<=90;i++)$('q'+i).disabled=locked||i>n;for(const k of ['trilha','total','file','importar','salvar','confirmar'])$(k).disabled=locked}async function open(id){const d=await req('detalhe',{id});current=d;const g=d.gabarito||{};$('title').textContent=d.prova.codigo_oficial+' — '+d.prova.descricao+' · Máximo: '+(d.prova.pontuacao_maxima??'—');$('trilha').value=g.CodTrilha||'';$('total').value=g.TotalQuestoes||'';$('state').textContent=g.Status||'PENDENTE — informe a quantidade de questões objetivas';$('file').value='';for(let i=1;i<=90;i++)$('q'+i).value=g['Q'+i]||'';$('pdf').hidden=!g.resolucao_r2_key;$('pdf').src=g.resolucao_r2_key?url('pdf',{id}):'about:blank';$('editor').hidden=false;enable();$('editor').scrollIntoView()}async function save(action){if(!current)return;const n=Number($('total').value);if(!Number.isInteger(n)||n<1||n>90)throw Error('Informe a quantidade de questões objetivas (1 a 90).');if(action==='confirmar'&&!confirm('Conferiu todas as respostas? A confirmação bloqueia a edição.'))return;if(action==='importar'&&!$('file').files[0])throw Error('Selecione a resolução PDF.');if(action==='importar'&&!confirm('A importação substituirá as respostas do rascunho. Continuar?'))return;const f=new FormData();f.set('total',n);f.set('trilha',$('trilha').value);f.set('revisao',current.gabarito?.revisao||0);const a={};for(let i=1;i<=n;i++)a[i]=$('q'+i).value;f.set('respostas',JSON.stringify(a));if(action==='importar')f.set('pdf',$('file').files[0]);const id=current.prova.id;const d=await req(action,{id},f);await open(id);await load();say('Salvo. '+(d.avisos||[]).join('\n')+(action==='importar'?' Confira todas as respostas com o PDF.':''))}async function run(fn){if(busy)return;busy=true;say('');try{await fn()}catch(e){say(e.message)}finally{busy=false}}for(let i=1;i<=90;i++){const l=document.createElement('label');l.textContent='Q'+i;const x=document.createElement('input');x.id='q'+i;x.maxLength=1;x.autocomplete='off';x.oninput=()=>{x.value=x.value.toUpperCase();if(/^[A-E#]$/.test(x.value)&&i<Number($('total').value))$('q'+(i+1)).focus()};l.append(x);$('grid').append(l)}$('total').oninput=enable;$('search').oninput=render;$('load').onclick=()=>run(load);for(const a of ['importar','salvar','confirmar'])$(a).onclick=()=>run(()=>save(a));$('close').onclick=()=>{if(busy)return;current=null;$('editor').hidden=true;$('pdf').src='about:blank'};const year=new URLSearchParams(location.search).get('ano');if(/^\d{4}$/.test(year||''))$('ano').value=year;run(load);
</script></html>
