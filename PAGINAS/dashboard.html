<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEC-AUXILIAR — Visão geral</title>
<script data-sec-auth-guard>
(function () {
  'use strict';
  document.documentElement.style.visibility = 'hidden';
  const login = 'https://www.secauxiliar.com.br/';
  const redirect = () => { window.location.replace(login); };
  fetch('https://apisec.secauxiliar.com.br/sec/auth_me.php', {
    method: 'GET', credentials: 'include', cache: 'no-store',
    headers: { 'Accept': 'application/json' }
  }).then(async (response) => {
    if (!response.ok) throw new Error('Sessão inválida');
    const data = await response.json();
    if (!data.ok || !data.user) throw new Error('Sessão inválida');
    document.documentElement.style.visibility = '';
  }).catch(redirect);
})();
</script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; background: #fff; }
body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px; }
.watermark { display: block; width: min(55vw, 620px); max-width: 100%; height: auto; max-height: 65vh; object-fit: contain; filter: brightness(0) saturate(100%) invert(20%) sepia(50%) saturate(1700%) hue-rotate(180deg); opacity: .08; user-select: none; pointer-events: none; }
@media (max-width: 600px) { body { padding: 24px; } .watermark { width: 78vw; } }
</style>
</head>
<body>
<img class="watermark" src="https://secauxiliar.com.br/fuvestao0926/logo-mini.png" alt="Curso Objetivo" draggable="false">
</body>
</html>
