<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviar folhas — Concurso de Bolsa</title><style>
:root{font-family:Arial,sans-serif;color:#173c68;background:#f5f8fd}*{box-sizing:border-box}body{margin:0;padding:18px}.card{background:#fff;border:1px solid #dbe5f0;border-radius:11px;padding:18px;max-width:1000px;margin:auto;box-shadow:0 3px 15px #1234  }h2{margin:0 0 8px}p{color:#58708b}button{background:#10457f;border:0;color:white;border-radius:7px;padding:11px 18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.small{font-size:12px}#message{padding:10px;margin:10px 0;white-space:pre-wrap}#message:empty{display:none}.error{background:#fff0ef;color:#9d2b23}.success{background:#eaf9ed;color:#236b3c}#files{padding:18px;border:2px dashed #b5cae1;border-radius:8px;margin:14px 0;width:100%}#log{line-height:1.7;max-height:240px;overflow:auto;border-top:1px solid #e0e8f0;margin-top:16px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border-bottom:1px solid #dbe5f0;padding:9px;text-align:left}th{background:#eaf0f8}@media(max-width:600px){body{padding:7px}.card{padding:12px}}
</style></head><body><div class="card"><h2>Enviar folhas de resposta</h2><p id="info">Carregando concurso...</p><p>Selecione de 1 a 10 arquivos JPG/JPEG, digitalizados em A5, orientação retrato e aproximadamente 300 DPI. A contagem dos presentes só será confirmada na conferência.</p><input type="file" id="files" accept=".jpg,.jpeg,image/jpeg" multiple><button id="send" disabled>Validar e enviar lote</button><div id="message"></div><div id="log"></div><h3>Lotes recebidos</h3><button id="refresh">Atualizar lotes</button><table><thead><tr><th>Lote</th><th>Data</th><th>Arquivos</th><th>Situação</th></tr></thead><tbody id="lotes"><tr><td colspan="4">—</td></tr></tbody></table></div>
<script>
const API='https://apisec.secauxiliar.com.br/sec/conc_folhas_api.php';
const concurso=new URLSearchParams(location.search).get('IdConcurso')||'';
const $=id=>document.getElementById(id);
function say(t,bad=false){$('message').textContent=t;$('message').className=bad?'error':'success'}
async function call(acao,data){const body=new FormData();for(const [k,v] of Object.entries(data||{}))body.append(k,v);body.append('acao',acao);const r=await fetch(API,{method:'POST',credentials:'include',body});let j;try{j=await r.json()}catch{throw Error('Resposta inválida do PHP ('+r.status+').')}if(!r.ok||!j.ok)throw Error(j.error||'Falha no servidor');return j}
async function listar(){try{let r=await fetch(API+'?acao=listar&IdConcurso='+encodeURIComponent(concurso),{credentials:'include',cache:'no-store'});let j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Não autorizado');$('lotes').replaceChildren();for(let l of j.lotes){let tr=document.createElement('tr');for(let k of ['id','criado_em','quantidade','status']){let td=document.createElement('td');td.textContent=l[k];tr.appendChild(td)}$('lotes').appendChild(tr)}if(!j.lotes.length)$('lotes').innerHTML='<tr><td colspan="4">Nenhum lote enviado ainda.</td></tr>';$('info').textContent='Concurso '+concurso+' — unidade obtida automaticamente do login';$('send').disabled=false}catch(e){say(e.message,true)}}
$('refresh').onclick=listar;
$('send').onclick=async()=>{const files=[...$('files').files];if(!files.length||files.length>10){say('Selecione de 1 a 10 imagens.',true);return}if(!files.every(f=>/\.jpe?g$/i.test(f.name))){say('Somente JPG/JPEG.',true);return}if(!confirm('Confirma o envio de '+files.length+' folhas para o concurso '+concurso+'?'))return;
 $('send').disabled=true;$('log').replaceChildren();let lote=null;let ok=0;
 try{const start=await call('iniciar',{IdConcurso:concurso});lote=start.lote_id;for(let i=0;i<files.length;i++){const row=document.createElement('div');row.textContent='Enviando '+files[i].name+'...';$('log').appendChild(row);try{await call('enviar',{lote_id:lote,seq:i+1,arquivo:files[i]});ok++;row.textContent='✔ '+files[i].name}catch(e){row.textContent='✖ '+files[i].name+': '+e.message}}if(ok===files.length){await call('finalizar',{lote_id:lote});say('Lote '+lote+' recebido: '+ok+' imagens.');$('files').value=''}else{say('Lote '+lote+' permanece ABERTO: '+ok+' de '+files.length+' enviadas. Não reenvie as folhas já recebidas. Procure a administração para concluir o lote parcial.',true)}}catch(e){say('Falha no lote '+(lote||'não criado')+': '+e.message,true)}finally{$('send').disabled=false;listar()}}
if(!/^[A-Za-z0-9_-]{1,50}$/.test(concurso))say('Concurso inválido.',true);else listar();
</script></body></html>
