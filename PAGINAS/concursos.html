<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SEC-AUXILIAR — Concursos</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --line: #dbe5f0;
            --ink: #172033;
            --muted: #68758a;
            --primary: #0b3b78;
            --primary-2: #1759a8;
            --danger: #b42318;
            --danger-bg: #fff1f0;
            --ok: #087443;
            --ok-bg: #ecfdf3;
            --shadow: 0 12px 35px rgba(18, 38, 63, .10);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        .topbar {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
            padding: 18px 24px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .18);
        }

        .topbar-inner {
            max-width: 1250px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .topbar h1 {
            margin: 0;
            font-size: 22px;
        }

        .topbar small {
            display: block;
            margin-top: 4px;
            opacity: .82;
        }

        .container {
            max-width: 1250px;
            margin: 24px auto;
            padding: 0 18px 40px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .toolbar {
            padding: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
        }

        .search-group {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 280px;
        }

        input, select, button {
            font: inherit;
        }

        input, select {
            width: 100%;
            border: 1px solid #cbd7e5;
            border-radius: 9px;
            padding: 10px 11px;
            background: #fff;
            color: var(--ink);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-2);
            box-shadow: 0 0 0 3px rgba(23, 89, 168, .12);
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover { background: var(--primary-2); }

        .btn-light {
            background: #eef3f8;
            color: #26364d;
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .btn-small {
            padding: 7px 10px;
            font-size: 13px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #e8eef5;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f8fafc;
            color: #43536a;
            font-size: 13px;
            white-space: nowrap;
        }

        td {
            font-size: 14px;
        }

        tr:hover td {
            background: #fbfdff;
        }

        .actions {
            display: flex;
            gap: 7px;
            white-space: nowrap;
        }

        .empty, .loading {
            padding: 36px 18px;
            text-align: center;
            color: var(--muted);
        }

        .status {
            padding: 11px 14px;
            border-radius: 9px;
            margin-bottom: 14px;
            display: none;
        }

        .status.ok {
            display: block;
            background: var(--ok-bg);
            color: var(--ok);
            border: 1px solid #a9e6c5;
        }

        .status.error {
            display: block;
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #f4b8b3;
        }

        dialog {
            width: min(760px, calc(100% - 28px));
            border: 0;
            border-radius: 15px;
            padding: 0;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
        }

        dialog::backdrop {
            background: rgba(13, 26, 45, .55);
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .modal-body {
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #3c4c62;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: flex-end;
            gap: 9px;
        }

        .counter {
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 680px) {
            .grid { grid-template-columns: 1fr; }
            .field.full { grid-column: auto; }
            .topbar-inner { align-items: flex-start; }
            .toolbar { align-items: stretch; }
            .search-group { min-width: 100%; }
            .toolbar > button { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div>
                <h1>Manutenção de Concursos</h1>
                <small>Tabela conc_bolsas</small>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="status" class="status"></div>

        <section class="card">
            <div class="toolbar">
                <div class="search-group">
                    <input
                        type="search"
                        id="busca"
                        placeholder="Buscar por concurso, descrição ou código da prova"
                        autocomplete="off"
                    >
                    <button type="button" class="btn-light" id="btnBuscar">Buscar</button>
                </div>

                <button type="button" class="btn-primary" id="btnNovo">
                    + Novo concurso
                </button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Data</th>
                            <th>Hora</th>
                            <th>Faixa</th>
                            <th>MD</th>
                            <th>DP</th>
                            <th>Descrição</th>
                            <th>Cód. prova</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr>
                            <td colspan="9" class="loading">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="toolbar">
                <span class="counter" id="contador">0 registro(s)</span>
            </div>
        </section>
    </main>

    <dialog id="modal">
        <form id="formConcurso">
            <div class="modal-header">
                <h2 id="tituloModal">Novo concurso</h2>
                <button type="button" class="btn-light btn-small" id="btnFechar">Fechar</button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="IdConcursoOriginal" name="IdConcursoOriginal">

                <div class="grid">
                    <div class="field">
                        <label for="IdConcurso">IdConcurso *</label>
                        <input type="number" id="IdConcurso" name="IdConcurso" min="1" required>
                    </div>

                    <div class="field">
                        <label for="CodProva">Código da prova *</label>
                        <input type="number" id="CodProva" name="CodProva" min="1" required>
                    </div>

                    <div class="field">
                        <label for="Data">Data *</label>
                        <input type="date" id="Data" name="Data" required>
                    </div>

                    <div class="field">
                        <label for="Hora">Hora *</label>
                        <input type="number" id="Hora" name="Hora" min="0" max="23" required>
                    </div>

                    <div class="field">
                        <label for="Faixa">Faixa *</label>
                        <input type="number" id="Faixa" name="Faixa" min="0" required>
                    </div>

                    <div class="field">
                        <label for="Md">MD</label>
                        <input type="number" id="Md" name="Md">
                    </div>

                    <div class="field">
                        <label for="Dp">DP</label>
                        <input type="number" id="Dp" name="Dp">
                    </div>

                    <div class="field full">
                        <label for="Descricao">Descrição *</label>
                        <input
                            type="text"
                            id="Descricao"
                            name="Descricao"
                            maxlength="255"
                            required
                        >
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-light" id="btnCancelar">Cancelar</button>
                <button type="submit" class="btn-primary" id="btnSalvar">Salvar</button>
            </div>
        </form>
    </dialog>

    <script>
    const API_BASE = 'https://apisec.secauxiliar.com.br/sec/';

    const API = {
        listar: API_BASE + 'listar_concursos.php',
        salvar: API_BASE + 'salvar_concurso.php',
        alterar: API_BASE + 'alterar_concurso.php',
        excluir: API_BASE + 'excluir_concurso.php'
    };
        const tbody = document.getElementById('tbody');
        const busca = document.getElementById('busca');
        const contador = document.getElementById('contador');
        const statusBox = document.getElementById('status');
        const modal = document.getElementById('modal');
        const form = document.getElementById('formConcurso');
        const tituloModal = document.getElementById('tituloModal');
        const btnSalvar = document.getElementById('btnSalvar');

        let registros = [];
        let editando = false;

        function escapar(texto) {
            return String(texto ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function exibirStatus(mensagem, tipo = 'ok') {
            statusBox.className = `status ${tipo}`;
            statusBox.textContent = mensagem;

            window.clearTimeout(exibirStatus.timer);
            exibirStatus.timer = window.setTimeout(() => {
                statusBox.className = 'status';
                statusBox.textContent = '';
            }, 5000);
        }

        async function api(url, options = {}) {
            const response = await fetch(url, {
                cache: 'no-store',
                ...options
            });

            let data;
            try {
                data = await response.json();
            } catch {
                throw new Error('Resposta inválida do servidor.');
            }

            if (!response.ok || data.ok === false) {
                throw new Error(data.message || 'Erro na operação.');
            }

            return data;
        }

        function formatarData(valor) {
            if (!valor) return '';

            const parte = String(valor).slice(0, 10);
            const [ano, mes, dia] = parte.split('-');

            if (!ano || !mes || !dia) return valor;
            return `${dia}/${mes}/${ano}`;
        }

        function valorOuVazio(valor) {
            return valor === null || valor === undefined ? '' : valor;
        }

        function renderizar() {
            contador.textContent = `${registros.length} registro(s)`;

            if (registros.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty">Nenhum concurso encontrado.</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = registros.map((item, indice) => `
                <tr>
                    <td>${escapar(item.IdConcurso)}</td>
                    <td>${escapar(formatarData(item.Data))}</td>
                    <td>${escapar(item.Hora)}</td>
                    <td>${escapar(item.Faixa)}</td>
                    <td>${escapar(valorOuVazio(item.Md))}</td>
                    <td>${escapar(valorOuVazio(item.Dp))}</td>
                    <td>${escapar(item.Descricao)}</td>
                    <td>${escapar(item.CodProva)}</td>
                    <td>
                        <div class="actions">
                            <button
                                type="button"
                                class="btn-light btn-small"
                                onclick="editarRegistro(${indice})"
                            >
                                Editar
                            </button>
                            <button
                                type="button"
                                class="btn-danger btn-small"
                                onclick="excluirRegistro(${indice})"
                            >
                                Excluir
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function carregar() {
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="loading">Carregando...</td>
                </tr>
            `;

            try {
                const q = busca.value.trim();
                const data = await api(`${API.listar}?q=${encodeURIComponent(q)}`);
                registros = data.dados || [];
                renderizar();
            } catch (erro) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty">${escapar(erro.message)}</td>
                    </tr>
                `;
                exibirStatus(erro.message, 'error');
            }
        }

        function abrirNovo() {
            editando = false;
            form.reset();
            document.getElementById('IdConcursoOriginal').value = '';
            tituloModal.textContent = 'Novo concurso';
            modal.showModal();
            document.getElementById('IdConcurso').focus();
        }

        window.editarRegistro = function(indice) {
            const item = registros[indice];
            editando = true;

            tituloModal.textContent = `Alterar concurso ${item.IdConcurso}`;

            document.getElementById('IdConcursoOriginal').value = item.IdConcurso;
            document.getElementById('IdConcurso').value = item.IdConcurso;
            document.getElementById('Data').value = String(item.Data || '').slice(0, 10);
            document.getElementById('Hora').value = valorOuVazio(item.Hora);
            document.getElementById('Faixa').value = valorOuVazio(item.Faixa);
            document.getElementById('Md').value = valorOuVazio(item.Md);
            document.getElementById('Dp').value = valorOuVazio(item.Dp);
            document.getElementById('Descricao').value = valorOuVazio(item.Descricao);
            document.getElementById('CodProva').value = valorOuVazio(item.CodProva);

            modal.showModal();
        };

        window.excluirRegistro = async function(indice) {
            const item = registros[indice];

            const confirma = confirm(
                `Excluir o concurso ${item.IdConcurso} - ${item.Descricao}?`
            );

            if (!confirma) return;

            try {
                const body = new URLSearchParams({
                    IdConcurso: item.IdConcurso
                });

                const data = await api(API.excluir, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
                    },
                    body
                });

                exibirStatus(data.message);
                await carregar();
            } catch (erro) {
                exibirStatus(erro.message, 'error');
            }
        };

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            btnSalvar.disabled = true;
            btnSalvar.textContent = 'Salvando...';

            try {
                const body = new URLSearchParams(new FormData(form));
                const endpoint = editando ? API.alterar : API.salvar;

                const data = await api(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
                    },
                    body
                });

                modal.close();
                exibirStatus(data.message);
                await carregar();
            } catch (erro) {
                exibirStatus(erro.message, 'error');
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.textContent = 'Salvar';
            }
        });

        document.getElementById('btnNovo').addEventListener('click', abrirNovo);
        document.getElementById('btnBuscar').addEventListener('click', carregar);
        document.getElementById('btnFechar').addEventListener('click', () => modal.close());
        document.getElementById('btnCancelar').addEventListener('click', () => modal.close());

        busca.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                carregar();
            }
        });

        modal.addEventListener('click', (event) => {
            const rect = modal.getBoundingClientRect();
            const dentro =
                event.clientX >= rect.left &&
                event.clientX <= rect.right &&
                event.clientY >= rect.top &&
                event.clientY <= rect.bottom;

            if (!dentro) modal.close();
        });

        carregar();
    </script>
</body>
</html>
