<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Comprovante de inscrição — Concurso de Bolsa</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8eef5;color:#172d48;font:13px Arial,sans-serif}.bar{padding:12px 20px;background:#143e7a;color:white;display:flex;justify-content:space-between;align-items:center}.bar button{padding:9px 14px;border:0;border-radius:5px;cursor:pointer}.paper{background:white;width:210mm;min-height:297mm;margin:15px auto;padding:17mm;box-shadow:0 5px 20px #1234}.head{display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:3px solid #184b8b;padding-bottom:16px}.head img{width:95mm;max-height:33mm;object-fit:contain;object-position:left center}.head h1{text-align:right;font-size:19px;color:#123f79;margin:0}.head p{text-align:right;color:#667a90;font-size:11px}.number{background:#edf4fc;margin:20px 0;padding:18px;border-left:5px solid #164e94}.number small{display:block;font-weight:bold;color:#556d86}.number strong{display:block;margin-top:4px;color:#113f7b;font-size:29px;letter-spacing:2px}.section{margin-top:22px}.section h2{font-size:13px;color:#174579;border-bottom:1px solid #d3dfeb;padding-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}.item small{display:block;color:#607489;font-size:10px;margin-bottom:5px}.item strong{font-size:12px;overflow-wrap:anywhere}.info{background:#f4f8fc;border:1px solid #dce5ef;padding:15px;line-height:1.6;margin-top:25px}.footer{text-align:center;border-top:1px solid #d4deeb;padding-top:12px;margin-top:30px;color:#63788b;font-size:10px}.error{color:#a12929;padding:20px;background:#fff1f0;margin:30px}.hidden{display:none}@page{size:A4 portrait;margin:0}@media print{body{background:white}.bar{display:none}.paper{margin:0;box-shadow:none;width:210mm;min-height:297mm;page-break-after:auto}}@media(max-width:850px){.paper{width:100%;min-height:auto;padding:24px}.head img{width:45%}.grid{grid-template-columns:1fr}}
</style></head><body><div class="bar"><strong>Comprovante de inscrição</strong><button id="print" disabled>Imprimir / Salvar PDF</button></div><div id="error" class="error hidden"></div><div id="paper" class="paper">Carregando comprovante...</div><script>
'use strict';const P=new URLSearchParams(location.search);const q={acao:'comprovante',IdConcurso:P.get('IdConcurso')||'',inscricao:P.get('inscricao')||''};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>{const d=String(s||'').slice(0,10).split('-');return d.length===3?d.reverse().join('/'): '—'};const item=(l,v)=>`<div class="item"><small>${esc(l)}</small><strong>${esc(v||'—')}</strong></div>`;
async function carregar(){try{if(!/^[A-Za-z0-9_-]{1,50}$/.test(q.IdConcurso)||!/^[0-9]{7}$/.test(q.inscricao))throw Error('Endereço de comprovante inválido.');const r=await fetch('https://apisec.secauxiliar.com.br/sec/inscricao_avulsa_concurso.php?'+new URLSearchParams(q),{credentials:'include',cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Erro ao carregar comprovante.');const i=d.inscricao,c=d.concurso,u=d.unidade;document.getElementById('paper').innerHTML=`<div class="head"><img src="objetivo_logo.png" alt="Curso Objetivo"><div><h1>COMPROVANTE DE INSCRIÇÃO</h1><p>CONCURSO DE BOLSA</p></div></div><div class="number"><small>NÚMERO DA INSCRIÇÃO</small><strong>${esc(i.NumeroInscricao)}</strong></div><div class="section"><h2>DADOS DO CANDIDATO</h2><div class="grid">${item('Nome',String(i.NomeCand||'').toLocaleUpperCase('pt-BR'))}${item('CPF',i.Cpf)}${item('Nascimento',fmt(i.DataDeNascimento))}${item('Carreira pretendida',i.Carreira)}${item('Celular',i.TelefoneCelular)}${item('Telefone',i.TelefoneResidencial)}${item('E-mail',i.Email)}</div></div><div class="section"><h2>DADOS DO CONCURSO</h2><div class="grid">${item('Concurso',c.IdConcurso+' — '+c.Descricao)}${item('Data da prova',fmt(c.Data))}${item('Horário',c.Hora+'h')}${item('Código da prova',c.CodProva)}${item('Faixa',c.Faixa)}${item('Unidade',u.idund+' — '+u.nome)}${item('Data de inscrição',fmt(i.DataInscricao))}</div></div><div class="info"><strong>ATENÇÃO</strong><p>Este comprovante confirma a inscrição no concurso indicado. O candidato deve observar as orientações e condições previstas no regulamento oficial do concurso, bem como os horários e instruções fornecidos pela unidade.</p><p>Conserve este documento para identificação e consulta da inscrição.</p></div><div class="footer">SEC-AUXILIAR · CURSO OBJETIVO · Documento emitido eletronicamente</div>`;document.getElementById('print').disabled=false;if(P.get('imprimir')==='1')setTimeout(()=>window.print(),400);}catch(e){document.getElementById('paper').classList.add('hidden');const el=document.getElementById('error');el.classList.remove('hidden');el.textContent=e.message;}}
document.getElementById('print').addEventListener('click',()=>window.print());carregar();
</script></body></html>
