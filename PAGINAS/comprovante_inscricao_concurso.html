<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprovante de inscrição — Concurso de Bolsa</title>

<style>
*{ box-sizing:border-box; }

body{
    margin:0;
    background:#e8eef5;
    color:#172d48;
    font:12px Arial, sans-serif;
}

.bar{
    padding:12px 20px;
    background:#143e7a;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.bar button{
    padding:9px 14px;
    border:0;
    border-radius:5px;
    cursor:pointer;
    background:#fff;
    color:#143e7a;
    font-weight:bold;
}

.paper{
    background:#fff;
    width:210mm;
    min-height:297mm;
    margin:10px auto;
    padding:12mm 14mm;
    box-shadow:0 5px 20px rgba(17,51,102,.18);
}

.head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:18px;
    border-bottom:2px solid #184b8b;
    padding-bottom:8px;
}

.head img{
    width:72mm;
    max-height:22mm;
    object-fit:contain;
    object-position:left center;
}

.head-right{
    text-align:right;
    padding-top:4px;
}

.head-right h1{
    margin:0;
    font-size:16px;
    color:#123f79;
    line-height:1.15;
}

.head-right p{
    margin:3px 0 0;
    color:#667a90;
    font-size:10px;
}

.number{
    margin:10px 0 12px;
    padding:8px 12px;
    border:2px solid #184b8b;
    background:#f8fbff;
    text-align:center;
    border-radius:4px;
}

.number small{
    display:block;
    font-weight:bold;
    color:#556d86;
    font-size:10px;
    letter-spacing:.6px;
}

.number strong{
    display:block;
    margin-top:3px;
    color:#113f7b;
    font-size:22px;
    letter-spacing:2px;
    text-align:center;
}

.section{
    margin-top:10px;
}

.section h2{
    font-size:12px;
    color:#174579;
    border-bottom:1px solid #d3dfeb;
    padding-bottom:5px;
    margin:0 0 8px;
}

.section-body{
    padding-left:16px; /* recuo visual */
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 18px;
}

.item{
    min-height:28px;
}

.item small{
    display:block;
    color:#607489;
    font-size:10px;
    margin-bottom:2px;
    text-transform:uppercase;
}

.item strong{
    display:block;
    font-size:12px;
    padding-left:10px; /* valor deslocado para a direita */
    overflow-wrap:anywhere;
}

.legal{
    margin-top:14px;
    border:1px solid #dce5ef;
    background:#f9fbfd;
    padding:12px 18px;
    line-height:1.42;
    font-size:10.8px;
    text-align:center;
}

.legal p{
    margin:0 0 10px;
}

.legal p:last-child{
    margin-bottom:0;
}

.footer{
    text-align:center;
    border-top:1px solid #d4deeb;
    padding-top:8px;
    margin-top:12px;
    color:#63788b;
    font-size:10px;
}

.error{
    color:#a12929;
    padding:20px;
    background:#fff1f0;
    margin:30px;
}

.hidden{
    display:none;
}

@page{
    size:A4 portrait;
    margin:0;
}

@media print{
    body{
        background:#fff;
    }

    .bar{
        display:none;
    }

    .paper{
        margin:0;
        box-shadow:none;
        width:210mm;
        min-height:297mm;
        page-break-after:auto;
    }
}

@media (max-width:850px){
    .paper{
        width:100%;
        min-height:auto;
        padding:24px;
    }

    .head{
        flex-direction:column;
        align-items:flex-start;
    }

    .head img{
        width:60%;
    }

    .head-right{
        text-align:left;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .section-body{
        padding-left:0;
    }
}
</style>
</head>
<body>

<div class="bar">
    <strong>Comprovante de inscrição</strong>
    <button id="print" disabled>Imprimir / Salvar PDF</button>
</div>

<div id="error" class="error hidden"></div>
<div id="paper" class="paper">Carregando comprovante...</div>

<script>
'use strict';

const P = new URLSearchParams(location.search);

const q = {
    acao: 'comprovante',
    IdConcurso: P.get('IdConcurso') || '',
    inscricao: P.get('inscricao') || ''
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
}[c]));

const fmtData = s => {
    const txt = String(s || '').trim();
    if (!txt) return '—';

    const parte = txt.slice(0, 10).split('-');
    return parte.length === 3 ? parte.reverse().join('/') : txt;
};

const fmtDataHora = s => {
    const txt = String(s || '').trim();
    if (!txt) return '—';

    const data = txt.slice(0, 10).split('-');
    const hora = txt.length >= 16 ? txt.slice(11, 16) : '';

    if (data.length === 3) {
        return data.reverse().join('/') + (hora ? ' ' + hora : '');
    }
    return txt;
};

const item = (l, v) => `
    <div class="item">
        <small>${esc(l)}</small>
        <strong>${esc(v || '—')}</strong>
    </div>
`;

async function carregar(){
    try{
        if(!/^[A-Za-z0-9_-]{1,50}$/.test(q.IdConcurso) || !/^[0-9]{7}$/.test(q.inscricao)){
            throw Error('Endereço de comprovante inválido.');
        }

        const r = await fetch(
            'https://apisec.secauxiliar.com.br/sec/inscricao_avulsa_concurso.php?' + new URLSearchParams(q),
            {
                credentials:'include',
                cache:'no-store'
            }
        );

        const d = await r.json();

        if(!r.ok || !d.ok){
            throw Error(d.error || 'Erro ao carregar comprovante.');
        }

        const i = d.inscricao || {};
        const c = d.concurso || {};
        const u = d.unidade || {};

        const nomeUnidade =
            u.nome ||
            u.Nome ||
            u.unidade ||
            u.Unidade ||
            i.NomeUnidade ||
            c.NomeUnidade ||
            '—';

        const codigoUnidade =
            u.idund ||
            u.IdUnidade ||
            i.IdUnidade ||
            c.IdUnidade ||
            '—';

        document.getElementById('paper').innerHTML = `
            <div class="head">
                <img src="objetivo_logo.png" alt="Curso Objetivo">
                <div class="head-right">
                    <h1>COMPROVANTE DE INSCRIÇÃO</h1>
                    <p>CONCURSO DE BOLSA / SIMULADO</p>
                </div>
            </div>

            <div class="number">
                <small>NÚMERO DA INSCRIÇÃO</small>
                <strong>${esc(i.NumeroInscricao)}</strong>
            </div>

            <div class="section">
                <h2>DADOS DO CANDIDATO</h2>
                <div class="section-body">
                    <div class="grid">
                        ${item('Nome', String(i.NomeCand || '').toLocaleUpperCase('pt-BR'))}
                        ${item('CPF', i.Cpf)}
                        ${item('Nascimento', fmtData(i.DataDeNascimento))}
                        ${item('Carreira pretendida', String(i.Carreira || '').toLocaleUpperCase('pt-BR'))}
                        ${item('Celular', i.TelefoneCelular)}
                        ${item('Telefone', i.TelefoneResidencial)}
                        ${item('E-mail', i.Email)}
                        ${item('Data de inscrição', fmtDataHora(i.DataInscricao))}
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>DADOS DO CONCURSO</h2>
                <div class="section-body">
                    <div class="grid">
                        ${item('Concurso', c.IdConcurso + ' — ' + c.Descricao)}
                        ${item('Data da prova', fmtData(c.Data))}
                        ${item('Horário', (c.Hora || '—') + 'h')}
                        ${item('Código da prova', c.CodProva)}
                        ${item('Faixa', c.Faixa)}
                        ${item('Unidade', codigoUnidade + ' — ' + nomeUnidade)}
                    </div>
                </div>
            </div>

            <div class="legal">
                <p>
                    Declaro estar de acordo com as normas descritas no regulamento do concurso de bolsa/simulado,
                    disponível em https://www.curso-objetivo.br, que vigorarão durante todo o período de Concurso
                    de Bolsa de Estudo, nada tendo a objetar à sua aplicação nem ao critério de apuração/pontuação da prova.
                </p>

                <p>
                    Estou ciente ainda de que, se qualquer dado aqui fornecido não corresponder à realidade,
                    minha prova será anulada e não terei direito aos descontos relativos a este concurso
                    e/ou acesso ao resultado do simulado.
                </p>
            </div>

            <div class="footer">
                SEC-AUXILIAR · CURSO OBJETIVO · Documento emitido eletronicamente
            </div>
        `;

        document.getElementById('print').disabled = false;

        if(P.get('imprimir') === '1'){
            setTimeout(() => window.print(), 400);
        }

    }catch(e){
        document.getElementById('paper').classList.add('hidden');
        const el = document.getElementById('error');
        el.classList.remove('hidden');
        el.textContent = e.message;
    }
}

document.getElementById('print').addEventListener('click', () => window.print());
carregar();
</script>

</body>
</html>
