<!doctype html><html lang="pt-BR"><head>
<script data-sec-auth-guard>
(function () {
  'use strict';
  document.documentElement.style.visibility = 'hidden';
  const login = 'https://www.secauxiliar.com.br/';
  const redirect = () => { window.location.replace(login); };
  fetch('https://apisec.secauxiliar.com.br/sec/auth_me.php', {
    method: 'GET', credentials: 'include', cache: 'no-store',
    headers: { 'Accept': 'application/json' }
  }).then(async (response) => {
    if (!response.ok) throw new Error('Sessão inválida');
    const data = await response.json();
    if (!data.ok || !data.user) throw new Error('Sessão inválida');
    document.documentElement.style.visibility = '';
  }).catch(redirect);
})();
</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,Segoe UI,Arial;background:#fff;color:#0f172a;padding:25px}.box{width:min(560px,100%);text-align:center;border:1px solid #dbe6f3;border-radius:18px;padding:42px;box-shadow:0 10px 30px rgba(11,59,120,.06)}h1{font-size:25px;margin:0 0 10px}p{color:#64748b;line-height:1.6;margin:0}.tag{display:inline-block;margin-top:20px;padding:8px 12px;border-radius:999px;background:#eef4fb;color:#0b3b78;font-weight:800;font-size:13px}</style></head><body><div class="box"><h1 id="titulo">Módulo</h1><p>Esta área já está preparada para receber a próxima tela da migração.</p><span class="tag">Em construção</span></div><script>const p=new URLSearchParams(location.search);document.getElementById('titulo').textContent=p.get('modulo')||'Módulo';</script></body></html>
