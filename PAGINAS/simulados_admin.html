<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEC — Cadastro de Simulados</title><style>
:root{--blue:#103e78;--line:#dce6f2;--bg:#f2f6fc;--text:#193656;--muted:#61758e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:13px 'Segoe UI',Arial,sans-serif;color:var(--text);padding:14px}header{background:linear-gradient(105deg,#103c76,#2164ab);color:#fff;border-radius:12px;padding:19px 22px}h1{font-size:21px;margin:0 0 5px}header p{margin:0;opacity:.85}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:14px 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 3px 15px #10386a0b}.toolbar .card{flex:1}label{display:block;font-size:11px;font-weight:700;margin-bottom:5px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #c8d7ea;border-radius:7px;padding:9px;font:inherit;background:#fff;color:var(--text)}button{background:var(--blue);border:0;border-radius:7px;color:#fff;font:700 12px 'Segoe UI',Arial;padding:9px 13px;cursor:pointer}button.alt{background:#eaf1f9;color:var(--blue)}button:disabled{opacity:.5;cursor:default}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e8edf5}th{background:#f3f7fc;color:#526b87;white-space:nowrap}.muted{color:var(--muted)}.status{background:#fff3d9;color:#8a5d08;padding:4px 7px;border-radius:20px;font-size:10px;font-weight:700}#msg{margin:8px 0;min-height:18px}#detail{margin-top:13px}dialog{border:0;border-radius:12px;width:min(900px,96vw);max-height:92vh;padding:0;box-shadow:0 22px 70px #102c5060}dialog::backdrop{background:#102c5080}.modalhead{padding:14px 17px;background:var(--blue);color:#fff;display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:16px}.modalbody{padding:17px;max-height:78vh;overflow:auto}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.full{grid-column:1/-1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.itemrow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin:8px 0;align-items:end}.pubrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:7px;margin:8px 0;align-items:end}.section{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}h3{font-size:14px;margin:0 0 10px}@media(max-width:750px){.fields{grid-template-columns:1fr}.itemrow,.pubrow{grid-template-columns:1fr 1fr}.toolbar .card{flex:1 1 100%}}
.status.ok{background:#e1f4e8;color:#17643a}dialog.completo{width:min(1250px,96vw)} .completo .modalbody{max-height:78vh} .savebar{position:sticky;bottom:0;background:white;padding:10px 0;border-top:1px solid var(--line)}</style></head><body><header><h1>Cadastro Geral de Simulados</h1><p>Calendário, códigos oficiais, disciplinas e públicos previstos · edição de rascunhos</p></header><div class="toolbar"><div class="card" style="max-width:160px"><label>Ano letivo</label><input type="number" id="ano" value="2027" min="2020" max="2100"></div><div class="card"><label>Localizar aplicação</label><input id="busca" placeholder="Data, descrição ou modalidade"></div><button id="recarregar">Atualizar</button><button id="nova">+ Nova aplicação</button></div><div id="msg" role="status"></div><div class="card tablewrap"><table><thead><tr><th>Data</th><th>Horário</th><th>Descrição</th><th>Modalidade</th><th>Provas</th><th>Situação</th><th></th></tr></thead><tbody id="lista"></tbody></table></div><section id="detail" class="card" hidden></section>
<dialog id="editor"><div class="modalhead"><h2 id="editorTitle">Editar</h2><button class="alt" id="fechar">Fechar</button></div><div class="modalbody"><form id="form"><div id="fields" class="fields"></div><div class="row savebar" style="margin-top:15px"><button type="submit">Salvar rascunho</button><span class="muted">Não publica nem altera notas</span></div></form></div></dialog>
<script>
'use strict';const API='https://apisec.secauxiliar.com.br/sec/simulados_admin_api.php';const $=id=>document.getElementById(id);let apps=[],detail=null,mode='',editId=null,auth=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function aviso(t,erro=false){$('msg').textContent=t;$('msg').style.color=erro?'#b4232d':'#177448'}
async function req(action,body=null,params={}){const u=new URL(API);u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{credentials:'include',cache:'no-store',headers:{Accept:'application/json',...(body?{'Content-Type':'application/json'}:{})},...(body?{method:'POST',body:JSON.stringify({...body,action})}:{})});const j=await r.json().catch(()=>null);if(!r.ok||!j?.ok)throw Error(j?.error||`Erro HTTP ${r.status}`);return j}
function field(name,label,value='',type='text',extra=''){return `<div><label>${esc(label)}</label><input name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function select(name,label,value,options){return `<div><label>${esc(label)}</label><select name="${esc(name)}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function textfield(name,label,value=''){return `<div class="full"><label>${esc(label)}</label><textarea name="${esc(name)}" rows="2">${esc(value)}</textarea></div>`}
async function carregar(){try{aviso('Consultando...');const j=await req('aplicacoes',null,{ano:$('ano').value});apps=j.aplicacoes;render();aviso(`${apps.length} aplicações carregadas.`)}catch(e){aviso(e.message,true)}}
function render(){const q=$('busca').value.toLocaleLowerCase('pt-BR');$('lista').innerHTML=apps.filter(a=>[a.data_aplicacao,a.descricao,a.modalidade].join(' ').toLocaleLowerCase('pt-BR').includes(q)).map(a=>`<tr><td>${esc(a.data_aplicacao)}</td><td>${esc((a.hora_inicio||'').slice(0,5))}</td><td>${esc(a.descricao)}</td><td>${esc(a.modalidade)}</td><td>${esc(a.total_provas)}</td><td><span class="status ${a.status==='CONFERIDO'?'ok':''}">${esc(a.status)}</span></td><td><button data-open="${a.id}" class="alt">Abrir</button></td></tr>`).join('')||'<tr><td colspan="7">Nenhuma aplicação encontrada.</td></tr>'}
async function abrir(id){try{detail=await req('detalhe',null,{id});renderDetail();$('detail').hidden=false;$('detail').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){aviso(e.message,true)}}
function statusButton(x,t){if(!['RASCUNHO','CONFERIDO'].includes(x.status))return '';return `<button class="alt" data-status-id="${x.id}" data-status-tipo="${t}" data-status-atual="${esc(x.status)}">${x.status==='RASCUNHO'?'Confirmar conferência':'Reabrir'}</button>`}
async function mudarStatus(b){const t=b.dataset.statusTipo, atual=b.dataset.statusAtual;const reabrir=atual==='CONFERIDO';if(!confirm(reabrir?'Reabrir para edição? Ao reabrir uma prova, a aplicação conferida também voltará a rascunho.':'Confirma que os dados foram conferidos? Esta ação não publica a prova.'))return;b.disabled=true;try{await req('alterar_status',{tipo:t,id:b.dataset.statusId,status:reabrir?'RASCUNHO':'CONFERIDO'});const id=detail.aplicacao.id;await carregar();await abrir(id);aviso('Situação atualizada.')}catch(e){alert(e.message)}finally{b.disabled=false}}
async function excluirProva(b){const p=detail.provas.find(x=>String(x.id)===b.dataset.excluirprova);if(!p)return;const app=detail.aplicacao.id;if(!confirm(`Excluir definitivamente a prova ${p.codigo_oficial} — ${p.descricao}?`))return;b.disabled=true;try{await req('excluir_prova',{id:p.id,aplicacao_id:app,codigo_oficial:p.codigo_oficial});await carregar();await abrir(app);aviso('Prova excluída.')}catch(e){alert(e.message)}finally{b.disabled=false}}
function renderDetail(){const a=detail.aplicacao;const ps=detail.provas;const disciplinas=detail.disciplinas;const publicos=detail.publicos;$('detail').innerHTML=`<div class="row" style="justify-content:space-between"><div><h2 style="font-size:17px;margin:0">${esc(a.descricao)}</h2><p class="muted">${esc(a.data_aplicacao)} · ${esc(a.status)} · ${ps.length} provas</p></div><div class="row"><button class="alt" data-editapp="${a.id}">Editar aplicação</button>${statusButton(a,"aplicacao")}<button data-newprova="${a.id}">+ Prova</button></div></div><div class="tablewrap"><table><thead><tr><th>Código</th><th>Prova</th><th>Versão</th><th>Tipo</th><th>Disciplinas</th><th>Públicos</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${ps.map(p=>`<tr><td><strong>${esc(p.codigo_oficial)}</strong></td><td>${esc(p.descricao)}</td><td>${esc(p.versao)}</td><td>${esc(p.tipo_avaliacao)}</td><td>${disciplinas.filter(d=>d.prova_id==p.id).length}</td><td>${publicos.filter(x=>x.prova_id==p.id).length}</td><td><span class="status ${p.status==='CONFERIDO'?'ok':''}">${esc(p.status)}</span></td><td><div class="row">${statusButton(p,"prova")}<button class="alt" data-editprova="${p.id}">Editar</button>${a.status==='RASCUNHO'&&p.status==='RASCUNHO'?`<button class="alt" style="color:#a12626" data-excluirprova="${p.id}">Excluir</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="8">Nenhuma prova cadastrada.</td></tr>'}</tbody></table></div><p class="muted">Público previsto não impede lançamento futuro de notas de alunos fora do público. Não há publicação nesta tela.</p>`}
function editar(tipo,id=null){mode=tipo;editId=id;$('editor').classList.toggle('completo',tipo==='prova');let html='';if(tipo==='aplicacao'){const a=id?detail.aplicacao:{};$('editorTitle').textContent=id?'Editar aplicação':'Nova aplicação';html=field('ano_letivo','Ano',a.ano_letivo||$('ano').value,'number','required')+field('data_aplicacao','Data',a.data_aplicacao||'','date','required')+field('hora_inicio','Início',(a.hora_inicio||'').slice(0,5),'time')+field('hora_fim','Fim',(a.hora_fim||'').slice(0,5),'time')+field('descricao','Descrição',a.descricao||'','text','required maxlength="180"')+field('modalidade','Modalidade',a.modalidade||'')+field('origem_calendario','Origem',a.origem_calendario||'')+textfield('observacoes','Observações',a.observacoes||'');}
if(tipo==='prova'){const p=id?detail.provas.find(x=>x.id==id):{};$('editorTitle').textContent=id?'Editar prova':'Nova prova';html=field('codigo_oficial','Código oficial (5 dígitos)',p.codigo_oficial||'','text','required pattern="[0-9]{5}" maxlength="5"')+field('descricao','Descrição',p.descricao||'','text','required maxlength="180"')+field('versao','Versão',p.versao||'')+field('grupo','Grupo',p.grupo||'')+select('tipo_avaliacao','Tipo',p.tipo_avaliacao||'OUTRA',['OUTRA','OBJETIVA','DISSERTATIVA','MISTA'])+field('pontuacao_maxima','Pontuação máxima',p.pontuacao_maxima||'','number','min="0" step="0.01"')+textfield('observacoes','Observações',p.observacoes||'')+`<div class="full section"><h3>Disciplinas da prova</h3><div id="discItems"></div><button type="button" class="alt" id="addDisc">+ Adicionar disciplina</button></div><div class="full section"><h3>Públicos previstos</h3><div id="pubItems"></div><button type="button" class="alt" id="addPub">+ Adicionar público</button></div>`;}
if(tipo==='disciplinas'||tipo==='publicos'){$('editorTitle').textContent=tipo==='disciplinas'?'Disciplinas da prova':'Públicos previstos';const rows=(tipo==='disciplinas'?detail.disciplinas:detail.publicos).filter(x=>x.prova_id==id);html=`<div class="full"><p class="muted">Alteração integral da lista desta prova, com transação no banco. Confira antes de salvar.</p><div id="items"></div><button type="button" id="additem" class="alt">+ Adicionar linha</button></div>`;}
$('fields').innerHTML=html;if(tipo==='prova'){for(const [kind,target,button,rows] of [['disciplinas','discItems','addDisc',detail.disciplinas],['publicos','pubItems','addPub',detail.publicos]]){if(id)rows.filter(x=>x.prova_id==id).forEach(x=>addItem(x,kind,target));$(button).onclick=()=>addItem({},kind,target);}}if(tipo==='prova')atualizarPontuacao();$('editor').showModal();if(tipo==='disciplinas'||tipo==='publicos'){const rows=(tipo==='disciplinas'?detail.disciplinas:detail.publicos).filter(x=>x.prova_id==id);rows.forEach(x=>addItem(x));$('additem').onclick=()=>addItem({})}}
function addItem(x,kind=mode,target='items'){const d=document.createElement('div');d.className=kind==='disciplinas'?'itemrow':'pubrow';if(kind==='disciplinas'){d.innerHTML=field('disciplina','Disciplina',x.disciplina||'')+field('pontuacao_maxima','Pontuação máxima',x.pontuacao_maxima||'','number','min="0" step="0.01"')+'<button type="button" class="alt remove">Remover</button>'}else{d.innerHTML=select('criterio','Critério',x.criterio||'CURSO_GERAL',['CURSO_GERAL','OPCIONAL','TURMA_ESPECIFICA'])+field('curso','Curso',x.curso||'')+field('area','Área',x.area||'')+field('turma','Turma',x.turma||'')+field('cod_unidade','Unidade',x.cod_unidade||'')+'<button type="button" class="alt remove">Remover</button>'}d.querySelector('.remove').onclick=()=>{d.remove();if(mode==='prova')atualizarPontuacao()};d.insertAdjacentHTML('beforeend',`<input type="hidden" name="observacoes" value="${esc(x.observacoes||'')}">`);$(target).append(d);if(mode==='prova')atualizarPontuacao()}
function atualizarPontuacao(){if(mode!=='prova')return;const tipo=$('fields').querySelector('[name=tipo_avaliacao]');const max=$('fields').querySelector('[name=pontuacao_maxima]');const items=$('discItems');if(!tipo||!max||!items)return;const auto=tipo.value==='DISSERTATIVA';if(auto&&!max.readOnly)max.dataset.manual=max.value;if(!auto&&max.readOnly)max.value=max.dataset.manual||'';max.readOnly=auto;max.style.background=auto?'#edf2f8':'';max.title=auto?'Soma automática das disciplinas':'';if(auto){const vals=[...items.querySelectorAll('[name=pontuacao_maxima]')].map(e=>e.value);max.value=vals.some(v=>v!=='')?(vals.reduce((sum,v)=>sum+Math.round(Number(v||0)*100),0)/100).toFixed(2):'';}}
$('fields').addEventListener('input',atualizarPontuacao);$('fields').addEventListener('change',atualizarPontuacao);
$('form').onsubmit=async e=>{e.preventDefault();const btn=$('form').querySelector('[type=submit]');btn.disabled=true;try{let payload={};if(mode==='aplicacao'||mode==='prova'){payload=Object.fromEntries([...$('fields').children].flatMap(row=>row.classList.contains('section')?[]:[...row.querySelectorAll('[name]')]).map(el=>[el.name,el.value]));if(editId)payload.id=editId;if(mode==='prova'){payload.aplicacao_id=detail.aplicacao.id;for(const [key,target] of [['disciplinas','discItems'],['publicos','pubItems']])payload[key]=[...$(target).children].map(row=>Object.fromEntries([...row.querySelectorAll('[name]')].map(el=>[el.name,el.value])));}}else{payload.prova_id=editId;payload.items=[...$('items').children].map(row=>Object.fromEntries([...row.querySelectorAll('[name]')].map(el=>[el.name,el.value])))}await req('salvar_'+(mode==='aplicacao'?'aplicacao':mode==='prova'?'prova_completa':mode),payload);$('editor').close();aviso('Rascunho salvo.');if(mode==='aplicacao'){await carregar();if(editId)await abrir(editId);else $('detail').hidden=true}else await abrir(detail.aplicacao.id)}catch(err){aviso(err.message,true);alert(err.message)}finally{btn.disabled=false}};
$('lista').onclick=e=>{const b=e.target.closest('[data-open]');if(b)abrir(b.dataset.open)};$('detail').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.excluirprova){excluirProva(b);return;}if(b.dataset.statusId){mudarStatus(b);return;}if(b.dataset.editapp)editar('aplicacao',Number(b.dataset.editapp));if(b.dataset.newprova)editar('prova');if(b.dataset.editprova)editar('prova',Number(b.dataset.editprova));if(b.dataset.disc)editar('disciplinas',Number(b.dataset.disc));if(b.dataset.pub)editar('publicos',Number(b.dataset.pub))};$('nova').onclick=()=>editar('aplicacao');$('recarregar').onclick=carregar;$('busca').oninput=render;$('fechar').onclick=()=>$('editor').close();
(async()=>{try{const r=await fetch('https://apisec.secauxiliar.com.br/sec/auth_me.php',{credentials:'include',cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok||String(j.user?.nivel||'').toLowerCase()!=='admin')throw Error('Acesso restrito a administradores.');await carregar()}catch(e){aviso(e.message,true);document.querySelectorAll('button').forEach(b=>b.disabled=true)}})();
</script></body></html>
